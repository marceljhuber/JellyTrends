overview: "Netflix-style trending rows built from your own library"
description: >
  Pulls trending movie and show charts from TMDB, Trakt or the keyless
  Cinemeta catalog, matches them against your library by IMDb/TMDB/TVDB id,
  and renders Top N rows that keep each title's real online chart position.
  Row size is configurable. Works on Jellyfin Web, the Android and iOS apps,
  and Jellyfin Media Player.
category: "General"
